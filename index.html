<style>
* { box-sizing: border-box; }

body {

  min-height: 100vh;
}

header {
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #263b58;
}

.logo {
  background: #168cff;

}

h1 { font-size: 35px; }

.welcome {
  color: #a9bed9;
  line-height: 1.6;
}

#chat {
  background: #12243c;
  border: 1px solid #294463;
  border-radius: 16px;
  padding: 18px;
  margin-top: 30px;
  min-height: 150px;
  text-align: left;
}

#messages { min-height: 70px; }

.input-area {
  display: flex;

input {
